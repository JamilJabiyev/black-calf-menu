<!doctype html>
<html lang="az" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Black Calf — QR</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=2026-11-25-r13">
<link rel="stylesheet" href="css/qr.css?v=2026-11-25-r13">
<script defer src="js/vendor/qrcode-generator-1.4.4.min.js"></script>
<script type="module" src="js/qr.js?v=2026-11-25-r13"></script>
</head>
<body>
<main class="qr-page">
  <div class="qr-tools">
    <h1 class="qr-tools__t">Black Calf · QR</h1>
    <p class="qr-tools__hint">QR-kartları çap et və ya yüklə · Распечатай или скачай QR-карточки · Print or download QR cards.</p>
    <form class="qr-form" data-js="form">
      <label class="qr-field">Menu URL<input name="url" type="url" required></label>
      <label class="qr-field">Yer / Место / Place (src)
        <select name="src">
          <option value="">—</option><option>table</option><option>board</option>
          <option>window</option><option>pack</option><option>insta</option>
        </select>
      </label>
      <label class="qr-field qr-field--s">Say / Кол-во<input name="count" type="number" min="1" max="12" value="4"></label>
      <div class="qr-actions">
        <button class="btn btn--primary" type="button" data-js="print">Print</button>
        <button class="btn btn--ghost" type="button" data-js="svg">SVG</button>
        <button class="btn btn--ghost" type="button" data-js="png">PNG</button>
      </div>
    </form>
  </div>
  <div class="qr-sheet" data-js="sheet"></div>
</main>
</body>
</html>
